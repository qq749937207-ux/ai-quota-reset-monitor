# 公开的 AI 突发 / 额外额度重置事件时间线（机器可读）
#
# 收录规则：
#   - 只收录正常额度周期之外的突发或额外重置、加赠、可储蓄一次性额度。
#   - 每条必须有可当场核对的原帖或官方链接；没有核对过的事件不要写入。
#   - status 为 official（正式宣布）或 suspected（高度疑似）。
#   - 正式宣布：官方或监测名单中的授权账号明确表示正在重置、已经重置，或发放可储蓄重置。
#   - 高度疑似：来自监测账号、尚未正式宣布，但强烈暗示即将或可能有一次额外重置。
#   - 疑似不计入正式次数。若之后正式宣布，将本条改为 official，并填写 confirmed_at /
#     confirmed_source，保留原疑似来源；不要再新增一条正式事件重复计数。
#   - 不算：路人猜测、无关玩笑、常规提额、限期加倍、套餐改价、单纯的产品发布、
#     正常周期恢复、自动回复，以及仅针对故障受影响用户的小范围补偿（除非来源明确
#     向更大范围用户发放了额外重置）。
#   - 同一事件被多人宣布或转发只保留一条。
#
# 字段：
#   id              稳定可读标识，格式 YYYY-MM-DD-company-shortslug（日期为北京时间日期）
#   company         OpenAI、xAI 或 Anthropic
#   status          official 或 suspected
#   announced_at    公布或被观察到的本地时间，格式 YYYY-MM-DD HH:MM
#   timezone        固定为 Asia/Shanghai（UTC+8）。来源若为其他时区，已换算后再写入。
#   products        来源明确提到的产品线；未写明则留空列表，不要猜测。
#   summary         一句话要点，不引用、不改写原帖措辞
#   source.url      可打开的原帖或官方链接
#   source.account  来源账号，如 @ClaudeDevs
#   source.post_id  若为 X 帖，则为帖 ID
#   confirmed_at / confirmed_source  仅用于疑似转正式
#   notes           可选补充（如尚未被官方账号确认、即时到账或可储蓄、同事件跟帖）
#
# 人类可读对照见 docs/events.md。两份文件必须同步更新。
#
# 本初版覆盖范围与排除项见 docs/events.md 文首说明。不保证历史完整。

